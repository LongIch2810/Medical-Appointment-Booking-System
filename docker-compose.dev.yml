version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend-app
    ports:
      - "3010:3000"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - CHATBOT_URL=http://chatbot:5000
      - FRONTEND_URL=http://localhost:5183
      - GOOGLE_CALL_BACK=http://localhost:3010/api/v1/auth/google/redirect
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/v1', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend-app
    ports:
      - "5183:5173"
    env_file:
      - ./frontend/.env
    environment:
      - VITE_BACKEND_URL=http://localhost:3010
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    container_name: admin-app
    ports:
      - "4183:4173"
    env_file:
      - ./admin/.env
    environment:
      - VITE_BACKEND_URL=http://localhost:3010
    volumes:
      - ./admin:/app
      - /app/node_modules
    depends_on:
      - backend

  chatbot:
    build:
      context: ./chatbot
      dockerfile: Dockerfile.dev
    container_name: chatbot-app
    expose:
      - "5000"
    env_file:
      - ./chatbot/.env
    environment:
      - DB_HOST=postgres
      - BACKEND_URL=http://backend:3000
      - REDIS_HOST=redis
    volumes:
      - ./chatbot:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis
    container_name: redis-db
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass 123456

  postgres:
    image: postgres:17
    container_name: postgresql_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=booking_doctor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d booking_doctor_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    restart: always
    depends_on:
      - redis

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-ui
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@local.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    ports:
      - "8000:80"
    depends_on:
      - postgres

volumes:
  redis_data:
  postgres_data:
